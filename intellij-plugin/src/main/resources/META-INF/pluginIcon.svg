<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 64 64"
     role="img" aria-label="Selenium Boot">
  <!--
    Selenium Boot brand mark — hexagon + stylized "S" + check.
    Geometry and gradient are kept in sync with the website logo
    (selenium-boot-website/public/logo.svg). The hexagon is FILLED here
    rather than outlined so the mark holds contrast on both the light and
    dark JetBrains Marketplace themes; the website uses the outlined form
    against a known white background.
  -->
  <defs>
    <linearGradient id="sbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC15A"/>
      <stop offset="1" stop-color="#1E5B7B"/>
    </linearGradient>
  </defs>

  <!-- Hexagon container -->
  <path d="M32 5 L55.4 18.5 L55.4 45.5 L32 59 L8.6 45.5 L8.6 18.5 Z"
        fill="url(#sbGrad)" stroke="url(#sbGrad)" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Stylized S -->
  <path d="M31 23 C31 19, 20 19, 20 25 C20 30, 31 30, 31 36 C31 42, 20 42, 20 38"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Check mark -->
  <path d="M34 33 L39 39 L47 26"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
